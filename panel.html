<div id="iw-world-panel" aria-label="Immersive Worlds living world panel">
    <div id="iw-panel-backdrop"></div>
    <aside class="iw-shell">
        <header class="iw-panel-header">
            <div class="iw-brand-mark"><i class="fa-solid fa-compass"></i></div>
            <div>
                <strong>Immersive Worlds</strong>
                <span id="iw-director-status">World synchronized</span>
            </div>
            <button id="iw-close-panel" class="menu_button iw-icon-button" title="Close"><i class="fa-solid fa-xmark"></i></button>
        </header>
        <nav id="iw-panel-tabs">
            <button class="active" data-tab="world"><i class="fa-solid fa-map"></i><span>World</span></button>
            <button data-tab="people"><i class="fa-solid fa-people-group"></i><span>People</span></button>
            <button data-tab="items"><i class="fa-solid fa-box-open"></i><span>Items</span></button>
            <button data-tab="timeline"><i class="fa-solid fa-timeline"></i><span>History</span></button>
            <button data-tab="settings"><i class="fa-solid fa-sliders"></i><span>Control</span></button>
        </nav>
        <main id="iw-panel-body"></main>
    </aside>
</div>
<button id="iw-floating-button" title="Open living world">
    <i class="fa-solid fa-compass"></i>
    <span id="iw-location-label">Living World</span>
</button>
